name: Build & Pack NuGet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Đẩy lại lên GitHub Packages các .nupkg của GitHub Release có sẵn (vd v1.0.0); để trống = chỉ build'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Tag vX.Y.Z → Version=X.Y.Z; còn lại → VersionPrefix trong Directory.Build.props + suffix ci.<run>.
      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore WorkManagement.Shared.slnx

      - name: Build
        run: dotnet build WorkManagement.Shared.slnx -c Release --no-restore ${{ steps.version.outputs.args }}

      - name: Test
        run: dotnet test WorkManagement.Shared.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack WorkManagement.Shared.slnx -c Release --no-build -o out ${{ steps.version.outputs.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: |
            out/*.nupkg
            out/*.snupkg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: out

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # GitHub Packages: dùng GITHUB_TOKEN (permissions: packages: write) — không cần PAT.
  publish-github:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lấy gói từ artifact build (push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: out

      - name: Lấy gói từ GitHub Release (đẩy lại thủ công)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.nupkg" --dir out

      # GitHub Packages không nhận .snupkg → --no-symbols; --skip-duplicate để chạy lại không lỗi 409.
      - name: Push lên GitHub Packages
        run: >-
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate
          --no-symbols

